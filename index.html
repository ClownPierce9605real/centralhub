<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Cool Animated Ambient Background */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.25) 0%, transparent 50%);
      filter: blur(60px);
      animation: floatBg 12s ease-in-out infinite alternate;
    }

    @keyframes floatBg {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.1) translate(-20px, 15px); }
      100% { transform: scale(1) translate(20px, -15px); }
    }

    /* Container */
    .container {
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
    }

    /* Header & Stats Dashboard */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #a5b4fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(165, 180, 252, 0.3);
    }

    .dashboard-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 15px 30px;
      min-width: 200px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9ca3af;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: monospace;
      color: #38bdf8;
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .game-card:hover {
      transform: translateY(-8px);
      border-color: rgba(165, 180, 252, 0.4);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.25);
    }

    .game-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .game-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .play-btn {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .play-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <!-- Glowing Background -->
  <div class="bg-glow"></div>

  <div class="container">
    <header>
      <h1>🕹️ ARCADE HUB</h1>
      
      <!-- Stats / Timers -->
      <div class="dashboard-bar">
        <div class="stat-card">
          <div class="stat-label">Current Time</div>
          <div id="clock" class="stat-value">--:--:--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Playtime Session</div>
          <div id="playtime" class="stat-value">00:00:00</div>
        </div>
      </div>
    </header>

    <!-- Game List -->
    <main class="games-grid">

      <!-- Game 1 -->
      <div class="game-card">
        <div>
          <div class="game-icon">👆</div>
          <h2 class="game-title">Clicker</h2>
          <p class="game-desc">Get as many clicks as possible.</p>
        </div>
        <!-- Note: target="_blank" opens in a new tab so your session timer keeps running -->
        <a href="games/index.html" target="_blank" class="play-btn">Play Now</a>
      </div>

      <!-- Game 2 -->
      <div class="game-card">
        <div>
          <div class="game-icon">🐍</div>
          <h2 class="game-title">Retro Snake</h2>
          <p class="game-desc">Eat pixels, grow longer, and avoid running into yourself.</p>
        </div>
        <a href="games/snake/index.html" target="_blank" class="play-btn">Play Now</a>
      </div>

      <!-- Game 3 -->
      <div class="game-card">
        <div>
          <div class="game-icon">🧱</div>
          <h2 class="game-title">Brick Breaker</h2>
          <p class="game-desc">Classic arcade paddle game. Bounce the ball and destroy all bricks.</p>
        </div>
        <a href="games/brick-breaker/index.html" target="_blank" class="play-btn">Play Now</a>
      </div>

      <!-- Copy and paste more game cards here as you add games! -->

    </main>
  </div>

  <script>
    // 1. Live Clock Functionality
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Playtime Counter Functionality
    const startTime = Date.now();

    function updatePlaytime() {
      const elapsedMs = Date.now() - startTime;
      const totalSeconds = Math.floor(elapsedMs / 1000);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = (num) => String(num).padStart(2, '0');

      document.getElementById('playtime').innerText = 
        `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }
    setInterval(updatePlaytime, 1000);
    updatePlaytime();
  </script>
</body>
</html>
